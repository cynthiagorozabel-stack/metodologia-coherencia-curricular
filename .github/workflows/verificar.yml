name: Verificar demostracion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generar_datos.py
      - run: python scripts/analizar_datos.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- datos/sinteticos resultados
